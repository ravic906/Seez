<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one portrait play field centred on the screen; a score on top and a card over it between runs. */
:root {
  --bg: #e9edf6; --field: #f4f6fb; --ink: #1d2540; --bar: #232c4a; --bar-edge: #4a5686;
  --muted: #646f8e; --line: #cfd6e8; --card: #ffffff;
  --you: #ff4d5e; --best: #e29f00; --recent: #2f7cf6;
  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e1b; --field: #0f1527; --ink: #e6ebfa; --bar: #27315a; --bar-edge: #7d8fd0;
    --muted: #8f9bc0; --line: #243052; --card: #161e38;
    --you: #ff6b78; --best: #ffc233; --recent: #5ea0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e1b; --field: #0f1527; --ink: #e6ebfa; --bar: #27315a; --bar-edge: #7d8fd0;
  --muted: #8f9bc0; --line: #243052; --card: #161e38;
  --you: #ff6b78; --best: #ffc233; --recent: #5ea0ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-display);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.stage {
  position: relative; height: 100%; width: min(100%, 480px); margin: 0 auto; background: var(--field);
  touch-action: none; overflow: hidden; border-inline: 1px solid var(--line);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute; inset: 0 0 auto 0; top: 10px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none;
}
.board { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 8px; min-width: 0; overflow-wrap: anywhere; }
.score { text-align: center; }
.score strong { display: block; font: 800 56px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; transition: transform .12s ease-out; }
.score strong.bump { transform: scale(1.14); }
.score span { display: block; font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; min-height: 1.4em; }
.tools { justify-self: end; pointer-events: auto; }
.icon { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 17px; }
.icon[aria-pressed="false"] { color: var(--muted); }
.legend { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 16px; font: 500 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); pointer-events: none; padding-inline: 16px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }

.card {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: min(88%, 340px);
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 18px; text-align: center;
  box-shadow: 0 18px 50px rgb(10 15 40 / .22); display: flex; flex-direction: column; gap: 12px;
}
.card h1 { margin: 0; font: 800 44px/1 var(--f-display); letter-spacing: -.02em; }
.card p { margin: 0; color: var(--muted); font-size: 15px; text-wrap: balance; }
.card .big { font: 800 64px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.card .flag { font: 500 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--best); }
.card .stats { display: flex; justify-content: center; gap: 18px; font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.card .stats b { color: var(--ink); font-weight: 500; }
.cta { font: 800 17px var(--f-display); color: #fff; background: var(--you); border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer; }
.cta:active { transform: translateY(1px); }
.links { display: flex; justify-content: center; gap: 18px; }
.link { background: none; border: 0; color: var(--muted); font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--recent); outline-offset: 2px; }
[hidden] { display: none !important; }
.hint { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .score strong { transition: none; } }
</style>
<style id="standalone">
.hud { top: max(10px, env(safe-area-inset-top, 0px)); }
.legend { bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" aria-label="Game field. Slide your thumb left and right to steer."></canvas>

  <div class="hud">
    <div class="board" id="board"></div>
    <div class="score"><strong id="score">0</strong><span id="status"></span></div>
    <div class="tools"><button class="icon" id="sound" type="button" aria-pressed="true" aria-label="Sound">♪</button></div>
  </div>
  <div class="legend" id="legend"></div>

  <section class="card" id="start">
    <h1>Echoes</h1>
    <p>Slide your thumb to pass through the gaps. Every run comes back as a <b>ghost</b>. Don’t touch it.</p>
    <p class="hint" id="start-hint">Touch anywhere to start.</p>
    <div class="links"><button class="link" id="start-new" type="button">New board</button></div>
  </section>

  <section class="card" id="over" hidden>
    <div class="flag" id="over-flag"></div>
    <div class="big" id="over-score">0</div>
    <div class="stats"><span><b id="over-bars">0</b> bars</span><span><b id="over-grazes">0</b> grazes</span><span><b id="over-time">0</b> s</span></div>
    <p id="over-why"></p>
    <button class="cta" id="again" type="button">Go again</button>
    <div class="links"><button class="link" id="over-new" type="button">New board</button><button class="link" id="over-daily" type="button">Daily board</button></div>
  </section>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
